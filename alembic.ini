[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is injected from app config (app.core.config.settings) by alembic/env.py
# The line below is only a fallback for offline (--sql) mode; may be left empty.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/insight_ai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
